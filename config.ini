	6. Summaries are truth: If history starts with "--- History has been summarised ---", follow its analysis and "Next moves". Do not repeat actions marked as done or failed.
	7. Timeouts & Exit Code 124: Often acceptable for monitoring tools (strace, tcpdump). Check output files before declaring failure. If a script hangs, diagnose WHY (waiting for input? too much data?) before rewriting. Use TIMEOUT: to
