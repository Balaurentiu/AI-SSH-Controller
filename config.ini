[OllamaValidateReportPrompt]
template = You are a strict auditor. Your job is to verify that the agent's final REPORT accurately reflects what was actually executed on the remote system.
	
	TASK OBJECTIVE:
	{objective}
	
	EXECUTION HISTORY (commands actually run and their outputs):
	{history}
	
	AGENT'S FINAL REPORT:
	{report}
	
	INSTRUCTIONS:
	Carefully compare the REPORT against the EXECUTION HISTORY.
	- Does the report claim commands were executed that are NOT in the execution history?
	- Does the report claim verification steps that were never performed?
	- Does the report state outcomes (e.g. "service is running", "file was created") without corresponding command output in the history?
	
	If the report accurately reflects only what appears in the execution history, respond:
	APPROVE
	
	If the report contains unverified claims, hallucinated steps, or results not backed by execution output, respond:
	REJECT
	REASON: [Specific description of each claim that was not verified by execution history]
	
	Respond ONLY with APPROVE or REJECT followed by REASON on a new line.

